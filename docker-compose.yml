services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DRIVE_DATABASE_URL: postgresql+psycopg://drive:drive@db:5432/drive
      DRIVE_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - db
      - minio

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
